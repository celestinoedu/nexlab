<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexLab — gestão que conecta operação, clientes e financeiro para laboratórios de próteses dentárias." />
    <title>NexLab · Gestão que conecta</title>

    <!-- PWA: ícone e comportamento de app instalado no iOS/Safari, que não
    lê o manifest.webmanifest (injetado automaticamente pelo
    vite-plugin-pwa no build) tão bem quanto Android/Chrome — precisa
    dessas tags à parte pra "Adicionar à Tela de Início" funcionar direito. -->
    <meta name="theme-color" content="#0e7c79" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexLab" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <script>
      // GitHub Pages guarda o index.html em cache por 10 min (Cache-Control:
      // max-age=600). A cada novo deploy, os nomes dos arquivos .js/.css
      // mudam — quem abrir o app com um index.html em cache tenta carregar
      // um arquivo que não existe mais e a tela fica em branco (sem esse
      // script, silenciosamente). Isso captura essa falha e recarrega a
      // página com uma URL nova (nunca em cache), uma única vez por sessão.
      (function () {
        var CHAVE = 'nexlab-recarregou-apos-falha'
        window.addEventListener(
          'error',
          function (evento) {
            var alvo = evento.target
            if (alvo && alvo.tagName === 'SCRIPT' && !sessionStorage.getItem(CHAVE)) {
              sessionStorage.setItem(CHAVE, '1')
              var semParametros = location.href.split('#')[0].split('?')[0]
              location.replace(semParametros + '?v=' + Date.now() + location.hash)
            }
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
